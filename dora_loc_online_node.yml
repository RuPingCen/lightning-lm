nodes:
  - id: pointcloud_imu_pub_dora_node
    path: /home/mickrobot/dora_project/dora_tutorial/rosbag2dora/src/pointcloud_imu_pub_dora_node.py
    inputs:
      tick: dora/timer/millis/5   # 5ms   200Hz
    outputs:
      - pointcloud
      - imu
    env:
      BAG_PATH: /home/mickrobot/dataset/lightning-LM-dataset/NCLT/20130110   #ros2 bag path
  
  # lightning_lm localization
  - id: lightning_loc_node
    path: bin/run_loc_online_for_dora
    inputs:
      pointcloud: pointcloud_imu_pub_dora_node/pointcloud
      imu: pointcloud_imu_pub_dora_node/imu
    env:
      FLAGS_config: ./config/default_nclt_dora.yaml
    outputs:
      - pose
 
  - id: rerun_pose_node
    path: ./scripts/rerun_pose_node.py
    inputs:
      pose: lightning_loc_node/pose

